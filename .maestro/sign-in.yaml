# Requires USE_MOCK_API=true (development).
appId: com.example.expobase.dev
name: Sign in with the mock API
tags: [auth]
---
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 60000
- tapOn:
    id: sign-in-email
- inputText: e2e@example.com
- tapOn:
    id: sign-in-password
- inputText: test1234
- tapOn:
    id: sign-in-submit
- assertVisible:
    id: tab-notes
