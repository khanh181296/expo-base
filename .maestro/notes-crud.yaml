appId: com.example.expobase.dev
name: Create and delete a note
tags: [notes]
---
- runFlow: sign-in.yaml
- tapOn:
    id: tab-notes
- tapOn:
    id: notes-create
- tapOn:
    id: note-title
- inputText: Maestro note
# Closing the keyboard shifts the layout; do it before tapping Save
- hideKeyboard
- tapOn:
    id: note-save
- waitForAnimationToEnd
# Card text is merged into one accessibility label on iOS, so match the prefix
- assertVisible: 'Maestro note.*'
- tapOn: 'Maestro note.*'
- tapOn:
    id: note-delete
- tapOn:
    id: dialog-confirm
- assertNotVisible: 'Maestro note.*'
